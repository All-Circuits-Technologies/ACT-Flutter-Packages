name: act_barcode
description: This package contains widgets linked to barcodes, QR codes included

publish_to: none

# This package supports all platforms listed below.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.11.1
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # Generate the codes the widget displays
  barcode: ^2.2.9

  flutter_bloc: ^9.1.1

  flutter_svg: ^2.3.0

  # Read the barcodes with the camera
  mobile_scanner: ^7.4.2

  # Bloc base classes, which the scanner state is built on
  act_flutter_utility:
    path: ../act_flutter_utility

  # Default global manager
  act_global_manager:
    path: ../act_global_manager

  # Log the failures of the camera
  act_logger_manager:
    path: ../act_logger_manager

  # Ask the camera permission
  act_permissions_manager:
    path: ../act_permissions_manager

  # Platform the scanner runs on
  act_platform_manager:
    path: ../act_platform_manager

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Recommended lints for Flutter apps
  flutter_lints: ^6.0.0

  # The permissions of the device the tests answer in place of
  permission_handler_platform_interface: ^4.3.0

  # Life cycle of the application, driven by the tests
  act_app_life_cycle_manager:
    path: ../act_app_life_cycle_manager

  # Fakes shared by the tests of the ACT packages
  act_test_utility:
    path: ../act_test_utility
