# Project definition
name: act_logger_manager
description: This package contains a logger manager for your app, without any dependency on
  Flutter.

# Project configuration
publish_to: none

environment:
  sdk: ^3.13.0

# Project dependencies
dependencies:
  # Help to implement value based equality without explicit override
  equatable: ^2.0.7

  # Small, easy to use and extensible logger
  logger: ^2.5.0

  # Annotations (@protected, ...) without pulling any framework
  meta: ^1.17.0

  # Pure Dart config manager, whose base class the config mixins of the logger target
  act_dart_config_manager:
    path: ../act_dart_config_manager

  # Easily create managers
  act_dart_life_cycle:
    path: ../act_dart_life_cycle

  act_foundation:
    path: ../act_foundation

# Dependencies used by developer
dev_dependencies:
  test: ^1.32.0
  # flutter_lints rather than lints: the root analysis_options.yaml includes
  # package:flutter_lints/flutter.yaml, and when this include does not resolve, `dart format`
  # ignores the root options (line length of 100). flutter_lints is pure Dart (it only depends on
  # lints), so it brings no Flutter dependency.
  flutter_lints: ^6.0.0

  # Pure Dart fakes and helpers shared by the tests of the ACT packages
  act_dart_test_utility:
    path: ../act_dart_test_utility

  # Pure Dart helpers to parse YAML content, used by the config fake of the tests
  act_dart_yaml_utility:
    path: ../act_dart_yaml_utility
