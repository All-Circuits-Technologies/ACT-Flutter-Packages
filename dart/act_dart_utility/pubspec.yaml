name: act_dart_utility
description: This package contains useful methods and classes which extends dart
  functionality.
publish_to: none

environment:
  sdk: ^3.11.1

dependencies:
  meta: ^1.17.0

  equatable: ^2.0.7

  mutex: ^3.1.0

  path: ^1.9.1

  act_foundation:
    path: ../act_foundation

dev_dependencies:
  test: ^1.32.0
  lints: ^6.1.0

  # Controls the time seen by the tests, so that they never wait on a real delay
  fake_async: ^1.3.3

  # Fakes shared by the tests of the ACT packages
  act_dart_test_utility:
    path: ../act_dart_test_utility
