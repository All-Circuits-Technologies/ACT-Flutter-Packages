name: act_http_client_manager
description: Useful to request third HTTP servers
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  # Help to implement value based equality without explicit override
  equatable: ^2.0.7

  # Future-based API for HTTP requests
  http: ^1.6.0

  meta: ^1.17.0

  mutex: ^3.1.0

  # Default global manager
  act_dart_global_manager:
    path: ../act_dart_global_manager

  # Easily create managers
  act_dart_life_cycle:
    path: ../act_dart_life_cycle

  act_dart_utility:
    path: ../act_dart_utility

  act_foundation:
    path: ../act_foundation

  act_http_core:
    path: ../act_http_core

  # Logger manager
  act_logger_manager:
    path: ../act_logger_manager

  # Shared auth library
  act_shared_auth:
    path: ../act_shared_auth

dev_dependencies:
  test: ^1.32.0
  # flutter_lints rather than lints: the root analysis_options.yaml includes
  # package:flutter_lints/flutter.yaml, and when this include does not resolve, `dart format`
  # ignores the root options (line length of 100). flutter_lints is pure Dart (it only depends on
  # lints), so it brings no Flutter dependency.
  flutter_lints: ^6.0.0

  # Fakes shared by the tests of the ACT packages
  act_dart_test_utility:
    path: ../act_dart_test_utility
