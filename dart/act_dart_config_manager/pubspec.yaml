name: act_dart_config_manager
description: This package contains pure Dart helpers to manage config variables from their content
  and, optionally, from the file system.
publish_to: none

environment:
  sdk: ^3.11.1

# Project dependencies
dependencies:
  # Help to implement value based equality without explicit override
  equatable: ^2.0.7

  # Annotations (@protected, ...) without pulling any framework
  meta: ^1.16.0

  # Contains utilities for Dart
  act_dart_utility:
    path: ../act_dart_utility

  # Pure Dart helpers to parse YAML (and JSON) content into plain Dart objects
  act_dart_yaml_utility:
    path: ../act_dart_yaml_utility

  act_foundation:
    path: ../act_foundation

# Dependencies used by developer
dev_dependencies:
  test: ^1.32.0
  lints: ^6.1.0

  # Pure Dart fakes and helpers shared by the tests of the ACT packages
  act_dart_test_utility:
    path: ../act_dart_test_utility
