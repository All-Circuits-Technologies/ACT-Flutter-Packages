name: act_dart_yaml_utility
description: This package contains pure Dart helpers to parse YAML content (and JSON, which is
  valid YAML) into plain Dart objects.
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  yaml: ^3.1.3

dev_dependencies:
  test: ^1.32.0
  # flutter_lints rather than lints: the root analysis_options.yaml includes
  # package:flutter_lints/flutter.yaml, and when this include does not resolve, `dart format`
  # ignores the root options (line length of 100). flutter_lints is pure Dart (it only depends on
  # lints), so it brings no Flutter dependency.
  flutter_lints: ^6.0.0
