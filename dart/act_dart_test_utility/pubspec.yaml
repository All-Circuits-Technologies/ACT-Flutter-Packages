# Project definition
name: act_dart_test_utility
description: This package contains shared fakes and helpers to write the unit
  tests of the pure Dart ACT packages, without a dependency on Flutter.
publish_to: none

environment:
  sdk: ^3.13.0

# Project dependencies
dependencies:
  # Equatable for value equality in Dart objects
  equatable: ^2.0.8

  act_foundation:
    path: ../act_foundation

# This package is only meant to be used as a dev dependency. Keep its dependencies limited to the
# ACT packages whose interfaces are faked here. Those packages use this one in their own tests:
# pub resolves this cycle because this package is only ever a dev dependency.
# A fake which needs Flutter, or an ACT package which is not pure Dart, belongs to
# act_test_utility instead.

# Dependencies used by developer
dev_dependencies:
  test: ^1.32.0
  # flutter_lints rather than lints: the root analysis_options.yaml includes
  # package:flutter_lints/flutter.yaml, and when this include does not resolve, `dart format`
  # ignores the root options (line length of 100). flutter_lints is pure Dart (it only depends on
  # lints), so it brings no Flutter dependency.
  flutter_lints: ^6.0.0
