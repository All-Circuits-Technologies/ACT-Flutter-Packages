name: act_http_server_manager
description: This package contains the HTTP server manager
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  equatable: ^2.0.7

  meta: ^1.17.0

  # Help to create and compose web servers
  shelf: ^1.4.2

  # This package offers a request router for Shelf, matching request to handlers using route
  # patterns.
  shelf_router: ^1.1.4

  uuid: ^4.5.1

  act_dart_config_manager:
    path: ../act_dart_config_manager

  # Default global manager
  act_dart_global_manager:
    path: ../act_dart_global_manager

  # Flutter AC Technologies dependencies
  act_dart_life_cycle:
    path: ../act_dart_life_cycle

  # Extend Dart functionalities
  act_dart_utility:
    path: ../act_dart_utility

  act_foundation:
    path: ../act_foundation

  act_http_core:
    path: ../act_http_core

  act_http_logging_manager:
    path: ../act_http_logging_manager

  act_jwt_utilities:
    path: ../act_jwt_utilities

  # Logger manager
  act_logger_manager:
    path: ../act_logger_manager

dev_dependencies:
  test: ^1.32.0
  # flutter_lints rather than lints: the root analysis_options.yaml includes
  # package:flutter_lints/flutter.yaml, and when this include does not resolve, `dart format`
  # ignores the root options (line length of 100). flutter_lints is pure Dart (it only depends on
  # lints), so it brings no Flutter dependency.
  flutter_lints: ^6.0.0

  # The tokens the tests sign
  dart_jsonwebtoken: ^3.2.0

  # The client the tests reach the server with
  http: ^1.4.0

  # Fakes shared by the tests of the ACT packages
  act_dart_test_utility:
    path: ../act_dart_test_utility

  # Pure Dart helpers to parse YAML content, used by the config fake of the tests
  act_dart_yaml_utility:
    path: ../act_dart_yaml_utility
