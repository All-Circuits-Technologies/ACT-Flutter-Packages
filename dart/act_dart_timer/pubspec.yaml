name: act_dart_timer
description: This package provides a way to create timers that can be restarted
  and that can have a progressing duration.
publish_to: none

environment:
  sdk: ^3.11.1

dependencies:
  meta: ^1.17.0

  mutex: ^3.1.0

dev_dependencies:
  test: ^1.32.0
  lints: ^6.1.0


  # Controls the time seen by the tests, so that they never wait on a real delay
  fake_async: ^1.3.3
