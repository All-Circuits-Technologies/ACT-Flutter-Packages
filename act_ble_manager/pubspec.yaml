name: act_ble_manager
description: This package contains the base for Bluetooth Low Energy
publish_to: none

# This package supports all platforms listed below.
platforms:
  android:
  ios:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.11.1
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  async: ^2.13.0

  # Help to implement value based equality without explicit override
  equatable: ^2.0.7

  # Library to handle BLE for multiple devices
  flutter_reactive_ble: ^5.4.0

  # Mutual exclusion with implementation of normal and read-write mutex
  mutex: ^3.1.0

  act_abs_peripherals_manager:
    path: ../act_abs_peripherals_manager

  act_app_life_cycle_manager:
    path: ../act_app_life_cycle_manager

  act_config_manager:
    path: ../act_config_manager

  # Extend Dart functionalities
  act_dart_utility:
    path: ../act_dart_utility

  act_enable_service_utility:
    path: ../act_enable_service_utility

  act_flutter_utility:
    path: ../act_flutter_utility

  act_global_manager:
    path: ../act_global_manager

  act_life_cycle:
    path: ../act_life_cycle

  act_logger_manager:
    path: ../act_logger_manager

  act_permissions_manager:
    path: ../act_permissions_manager

  act_platform_manager:
    path: ../act_platform_manager

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The Bluetooth of the device the tests answer in place of
  reactive_ble_platform_interface: ^5.4.0

  # The permissions of the device the tests answer in place of
  permission_handler_platform_interface: ^4.3.0

  # The router the contextual views of the tests are displayed through
  act_router_manager:
    path: ../act_router_manager

  # The pages the tests display when the Bluetooth has to be switched on
  act_contextual_views_manager:
    path: ../act_contextual_views_manager

  # Fakes shared by the tests of the ACT packages
  act_test_utility:
    path: ../act_test_utility

  # Recommended lints for Flutter apps
  flutter_lints: ^6.0.0
