name: act_splash_screen_manager_mobile
description: Splash screen manager of the mobile applications
publish_to: none

platforms:
  android:
  ios:

environment:
  sdk: ^3.11.1
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # Base of the splash screen managers
  act_splash_screen_manager_core:
    path: ../act_splash_screen_manager_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # The tests check which managers the builder depends on
  act_logger_manager:
    path: ../act_logger_manager
