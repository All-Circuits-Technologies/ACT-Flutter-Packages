name: act_yaml_utility
description: This contains utility classes to manage YAML
publish_to: none

environment:
  sdk: ^3.11.1
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  yaml: ^3.1.3

  act_dart_result:
    path: ../dart/act_dart_result

  # Pure Dart YAML parsing this package builds the assets loading on top of
  act_dart_yaml_utility:
    path: ../dart/act_dart_yaml_utility

  # Contains utilities for Flutter
  act_flutter_utility:
    path: ../act_flutter_utility

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
