name: act_splash_screen_manager
description: Splash screen manager choosing what the platform of the application needs
publish_to: none

platforms:
  android:
  ios:
  linux:
  web:
  windows:

environment:
  sdk: ^3.11.1
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # Tells which platform the application runs on
  act_platform_manager:
    path: ../act_platform_manager

  # Base of the splash screen managers, re-exported to the applications
  act_splash_screen_manager_core:

    path: ../act_splash_screen_manager_core

  # One package per family of platforms, the right one is chosen at runtime
  act_splash_screen_manager_desktop:
    path: ../act_splash_screen_manager_desktop

  act_splash_screen_manager_mobile:
    path: ../act_splash_screen_manager_mobile

  act_splash_screen_manager_web:
    path: ../act_splash_screen_manager_web

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # The tests check which managers the builder depends on
  act_logger_manager:
    path: ../act_logger_manager
