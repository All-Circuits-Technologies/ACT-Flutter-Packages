# The native code of the desktop packages is not built by the workflow mono_repo generates, which
# only analyses and tests Dart. This one builds it, on the two platforms it targets, and runs the
# unit tests of the code they share.

name: Desktop native

on:
  push:
    paths:
      - "act_splash_screen_manager_desktop/**"
      - ".github/workflows/desktop_native.yml"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install what a GTK application is built with
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff
        with:
          flutter-version: "3.41.9"

      - name: Build the example and the unit tests
        working-directory: act_splash_screen_manager_desktop/example
        env:
          ACT_SPLASH_BUILD_TESTS: 1
        run: |
          flutter pub get
          flutter build linux --debug

      - name: Run the unit tests
        working-directory: act_splash_screen_manager_desktop/example
        run: >
          ./build/linux/x64/debug/plugins/act_splash_screen_manager_desktop/act_splash_screen_manager_desktop_test

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff
        with:
          flutter-version: "3.41.9"

      # The plugin is reached through a symlink nested deep under the example, and the name of the
      # package is repeated three times along the path of a header pulled that way: it passes the
      # 260 character limit the Windows toolchain still enforces, and the compiler cannot open the
      # header. Building from a short virtual drive keeps every path the compiler sees within the
      # limit, whatever the checkout is placed at.
      - name: Map the workspace to a short drive
        run: |
          subst W: "${{ github.workspace }}"

      - name: Build the example and the unit tests
        working-directory: 'W:\act_splash_screen_manager_desktop\example'
        env:
          ACT_SPLASH_BUILD_TESTS: 1
        run: |
          flutter pub get
          flutter build windows --debug

      # The layout of the build directory is not the same as the one of Linux, and the tests have
      # not been run on Windows yet: the binary is looked for rather than named.
      - name: Run the unit tests
        working-directory: 'W:\act_splash_screen_manager_desktop\example'
        run: |
          $test = Get-ChildItem -Path build\windows -Recurse -Filter act_splash_screen_manager_desktop_test.exe |
            Select-Object -First 1
          if ($null -eq $test) { throw "The unit tests were not built" }
          & $test.FullName
