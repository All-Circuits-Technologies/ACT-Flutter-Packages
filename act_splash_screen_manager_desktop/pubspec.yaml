name: act_splash_screen_manager_desktop
description: Splash screen manager of the desktop applications
publish_to: none

platforms:
  linux:

environment:
  sdk: ^3.11.1
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # Base of the splash screen managers
  act_splash_screen_manager_core:
    path: ../act_splash_screen_manager_core

  # Warns when the runner of the application does not draw any splash screen
  act_foundation:
    path: ../act_foundation
  act_logger_manager:
    path: ../act_logger_manager

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Fakes shared by the tests of the packages
  act_test_utility:
    path: ../act_test_utility

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: ActSplashScreenManagerDesktopPlugin
