# Project definition
name: act_intl_ui
description: This package contains graphical helpers linked to translations.

# Project configuration
publish_to: none

# This package supports all platforms listed below.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.11.1
  flutter: ">=3.29.0"

# Project dependencies
dependencies:
  # Flutter framework
  flutter:
    sdk: flutter

  # Widget rendering static HTML and CSS as Flutter widgets
  flutter_html: ^3.0.0

  # Help to implement value based equality without explicit override
  equatable: ^2.0.7

  # Implement the BLoC (Business Logic Component) design pattern
  flutter_bloc: ^9.1.1

  # Code to deal with internationalized/localized messages
  intl: ^0.20.2

  act_flutter_utility:
    path: ../act_flutter_utility

  # Global manager
  act_global_manager:
    path: ../act_global_manager

  # Non-graphical internationalization helpers
  act_intl:
    path: ../act_intl

# Pinned transitive dependencies
dependency_overrides:
  # flutter_html 3.0.0 imports html's internal src/query_selector.dart, whose
  # top-level 'matches' function was reshuffled in html 0.15.7 and no longer
  # resolves, breaking compilation. Cap html at 0.15.6 until flutter_html stops
  # depending on that private path.
  html: 0.15.6

# Dependencies used by developer
dev_dependencies:
  # API to test Flutter applications
  flutter_test:
    sdk: flutter

  # Recommended lints for Flutter apps
  flutter_lints: ^6.0.0

  # The translations of the widgets of Flutter, which a page of a test is shown in
  flutter_localizations:
    sdk: flutter

  # The in memory storage the tests keep the properties in
  shared_preferences_platform_interface: ^2.4.1

  # The configuration and the storage the locales of the tests are read from
  act_config_manager:
    path: ../act_config_manager

  act_local_storage_manager:
    path: ../act_local_storage_manager

  # Fakes shared by the tests of the ACT packages
  act_test_utility:
    path: ../act_test_utility
