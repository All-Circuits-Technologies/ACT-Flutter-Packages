# Project definition
name: act_global_manager
description: This package contains the default global_manager which has to be
  extended in the app.

# Project configuration
publish_to: none

# This package supports all platforms listed below.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# Project dependencies
dependencies:
  # Flutter framework
  flutter:
    sdk: flutter

  # Query information about the application package
  package_info_plus: ^8.3.0

  # Flutter AC Technologies dependencies
  act_config_manager:
    path: ../act_config_manager

  # Pure Dart global manager, which this package extends with what needs Flutter
  act_dart_global_manager:
    path: ../dart/act_dart_global_manager

  # Contains utilities for Dart
  act_dart_utility:
    path: ../dart/act_dart_utility

  # Easily create managers
  act_life_cycle:
    path: ../act_life_cycle

  # Logger manager
  act_logger_manager:
    path: ../dart/act_logger_manager

# Dependencies used by developer
dev_dependencies:
  # API to test Flutter applications
  flutter_test:
    sdk: flutter

  # Recommended lints for Flutter apps
  flutter_lints: ^6.0.0

  act_foundation:
    path: ../dart/act_foundation

  # Fakes and helpers shared by the tests of the ACT packages
  act_test_utility:
    path: ../act_test_utility
