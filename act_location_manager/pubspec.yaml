name: act_location_manager
description: This package is useful to get location from phones

publish_to: none

# This package supports all platforms listed below.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.11.1
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # Help to implement value based equality without explicit override
  equatable: ^2.0.7

  # Handle realtime location
  geolocator: ^14.0.1

  act_abs_peripherals_manager:
    path: ../act_abs_peripherals_manager

  act_app_life_cycle_manager:
    path: ../act_app_life_cycle_manager

  act_enable_service_utility:
    path: ../act_enable_service_utility

  act_global_manager:
    path: ../act_global_manager

  act_life_cycle:
    path: ../act_life_cycle

  act_logger_manager:
    path: ../act_logger_manager

  act_permissions_manager:
    path: ../act_permissions_manager

  act_platform_manager:
    path: ../act_platform_manager

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Recommended lints for Flutter apps
  flutter_lints: ^6.0.0

  # The location of the device the tests answer in place of
  geolocator_platform_interface: ^4.2.6

  # The permissions of the device the tests answer in place of
  permission_handler_platform_interface: ^4.3.0

  # The router the contextual views of the tests are displayed through
  act_router_manager:
    path: ../act_router_manager

  # The pages the tests display when the location has to be switched on
  act_contextual_views_manager:
    path: ../act_contextual_views_manager

  # Fakes shared by the tests of the ACT packages
  act_test_utility:
    path: ../act_test_utility
