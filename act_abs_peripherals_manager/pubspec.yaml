name: act_abs_peripherals_manager
description: Contains useful elements for managing peripherals such as BLE,
  WiFi, location, etc.
publish_to: none

# This package supports all platforms listed below.
platforms:
  android:
  ios:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.11.1
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  act_life_cycle:
    path: ../act_life_cycle

  act_enable_service_utility:
    path: ../act_enable_service_utility

  act_permissions_manager:
    path: ../act_permissions_manager

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # The permissions of the device the tests answer in place of
  permission_handler_platform_interface: ^4.3.0

  # The life cycle the tests move the application through
  act_app_life_cycle_manager:
    path: ../act_app_life_cycle_manager

  # The platform the tests say the application runs on
  act_platform_manager:
    path: ../act_platform_manager

  # The global manager the tests register the managers in
  act_global_manager:
    path: ../act_global_manager

  # Fakes shared by the tests of the ACT packages
  act_test_utility:
    path: ../act_test_utility
