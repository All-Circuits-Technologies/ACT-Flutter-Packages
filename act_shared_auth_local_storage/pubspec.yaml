name: act_shared_auth_local_storage
description: This contains services to store ids from the authentication
  services to act secure local storage.
publish_to: none

# This package supports all platforms listed below.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.11.1
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  equatable: ^2.0.7

  act_config_manager:
    path: ../act_config_manager

  act_dart_utility:
    path: ../act_dart_utility

  # Default global manager
  act_global_manager:
    path: ../act_global_manager

  # Easily create managers
  act_life_cycle:
    path: ../act_life_cycle

  act_local_storage_manager:
    path: ../act_local_storage_manager

  # Logger manager
  act_logger_manager:
    path: ../act_logger_manager

  act_shared_auth:
    path: ../act_shared_auth

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # The in memory storages the tests keep the properties and the secrets in
  flutter_secure_storage: ^9.2.4
  shared_preferences_platform_interface: ^2.4.1

  # The levels the tests read the logs of the package at
  act_foundation:
    path: ../act_foundation

  # Fakes shared by the tests of the ACT packages
  act_test_utility:
    path: ../act_test_utility
