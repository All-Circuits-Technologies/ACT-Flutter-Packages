name: act_halo_ble_layer
description: This is the BLE hardware layer for the HALO protocol

publish_to: none

# This package supports all platforms listed below.
platforms:
  android:
  ios:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.11.1
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  async: ^2.13.0

  # Help to implement value based equality without explicit override
  equatable: ^2.0.7

  mutex: ^3.1.0

  uuid: ^4.5.1

  act_ble_manager:
    path: ../act_ble_manager

  # Extend Dart functionalities
  act_dart_utility:
    path: ../act_dart_utility

  # Default global manager
  act_global_manager:
    path: ../act_global_manager

  act_halo_abstract:
    path: ../act_halo_abstract

  # Easily create managers
  act_life_cycle:
    path: ../act_life_cycle

  # Logger manager
  act_logger_manager:
    path: ../act_logger_manager

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Recommended lints for Flutter apps
  flutter_lints: ^6.0.0

  # The Bluetooth of the device the tests answer in place of
  reactive_ble_platform_interface: ^5.4.0

  # The permissions of the device the tests answer in place of
  permission_handler_platform_interface: ^4.3.0

  # The Bluetooth of the device the tests read through
  flutter_reactive_ble: ^5.4.0

  # The life cycle of an application under test
  act_app_life_cycle_manager:
    path: ../act_app_life_cycle_manager

  # The configuration of the Bluetooth of an application under test
  act_config_manager:
    path: ../act_config_manager

  # The permissions the Bluetooth needs
  act_permissions_manager:
    path: ../act_permissions_manager

  # The platform the tests say the application runs on
  act_platform_manager:
    path: ../act_platform_manager

  # Fakes shared by the tests of the ACT packages
  act_test_utility:
    path: ../act_test_utility
