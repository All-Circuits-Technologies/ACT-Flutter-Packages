name: act_firebase_crash
description: "Reports the crashes and the logs of an application to Firebase Crashlytics."
version: 0.1.0
publish_to: none

# This package supports all platforms listed below.
platforms:
  android:
  ios:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.11.1
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  equatable: ^2.0.7

  firebase_crashlytics: ^4.3.7

  act_config_manager:
    path: ../act_config_manager

  # The core package to manage firebase
  act_firebase_core:
    path: ../act_firebase_core

  act_foundation:
    path: ../act_foundation

  # Default global manager
  act_global_manager:
    path: ../act_global_manager

  # Contains useful classes to create managers in the app
  act_life_cycle:
    path: ../act_life_cycle

  # The logger manager
  act_logger_manager:
    path: ../act_logger_manager

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Starts the Firebase of a test, which the crash service hangs its Crashlytics under
  firebase_core: ^3.14.0

  # Firebase as a test answers for it
  firebase_core_platform_interface: ^6.0.0

  # Crashlytics as a test answers for it
  firebase_crashlytics_platform_interface: ^3.0.0

  # Lets a fake stand in for the Crashlytics of a device
  plugin_platform_interface: ^2.1.8

  # Fakes shared by the tests of the ACT packages
  act_test_utility:
    path: ../act_test_utility
